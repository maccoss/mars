name: .NET

on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dotnet/**'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        working-directory: dotnet
        run: dotnet restore

      - name: Build
        working-directory: dotnet
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        working-directory: dotnet
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  # Vendor formats: Thermo, Bruker and Sciex reading, and mzXML / mzMLb / mgf writing.
  #
  # Separate from the matrix above because it needs a pwiz-sharp checkout, which is a draft
  # branch with no package feed. Everything else in this workflow builds the configuration
  # MARS ships today - mzML only - and that configuration has to keep working, so it stays the
  # default rather than becoming a special case.
  #
  # Windows because it is the only platform where all three vendors work: the Sciex SDK is
  # Windows-only. Thermo and Bruker also build on Linux; adding that is worth doing once this
  # one has settled.
  pwiz:
    name: Vendor formats (pwiz-sharp)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Read the pinned pwiz-sharp commit
        id: pin
        shell: bash
        run: |
          commit=$(python -c "import json;print(json.load(open('dotnet/pwiz-sharp.json'))['commit'])")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Pinned to $commit"

      # Keyed on the commit, so a pinned build is fetched once and reused until the pin moves.
      # The tree is several gigabytes: without this every run would pay for it again.
      - name: Cache the pwiz checkout
        id: pwiz-cache
        uses: actions/cache@v4
        with:
          path: pwiz
          key: pwiz-sharp-${{ steps.pin.outputs.commit }}

      - name: Clone pwiz-sharp at the pin
        if: steps.pwiz-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Blobless: the history is not needed, only the tree at one commit. The FULL working
          # tree is needed though - Bruker reads archives from pwiz_aux and VC90 CRT files from
          # pwiz_tools/Shared/Lib, and Common.csproj embeds .obo files from pwiz/data/common.
          git clone --filter=blob:none --no-checkout             https://github.com/ProteoWizard/pwiz.git pwiz
          cd pwiz
          git checkout --detach ${{ steps.pin.outputs.commit }}

      # pwiz-sharp does not carry a global.json, so a runner with a newer SDK fails to resolve
      # one for the nested `dotnet run` that generates the vendor pins. Written here rather
      # than committed upstream because it is our build's problem to solve.
      - name: Pin the SDK for pwiz-sharp
        shell: bash
        run: |
          cat > pwiz/pwiz-sharp/global.json <<'JSON'
          { "sdk": { "version": "8.0.0", "rollForward": "latestFeature" } }
          JSON

      - name: Build with vendor support
        working-directory: dotnet
        shell: bash
        run: |
          dotnet build -c Release -warnaserror             -p:PwizSharpDir="$GITHUB_WORKSPACE/pwiz/pwiz-sharp"             -p:IAgreeToVendorLicenses=true

      - name: Test with vendor support
        working-directory: dotnet
        shell: bash
        run: |
          dotnet test --no-build -c Release --logger "console;verbosity=normal"             -p:PwizSharpDir="$GITHUB_WORKSPACE/pwiz/pwiz-sharp"             -p:IAgreeToVendorLicenses=true

      # The formats are the point of the job, so prove the binary can actually produce them
      # rather than only that the code compiles.
      - name: Publish and check the formats are offered
        working-directory: dotnet
        shell: bash
        run: |
          dotnet publish MARS/MARS.csproj -c Release -f net8.0 -r win-x64             --self-contained true -p:PublishSingleFile=true             -p:PwizSharpDir="$GITHUB_WORKSPACE/pwiz/pwiz-sharp"             -p:IAgreeToVendorLicenses=true             -o "$GITHUB_WORKSPACE/vendor-build"

          cd "$GITHUB_WORKSPACE/vendor-build"
          capabilities=$(./mars.exe --version)
          echo "$capabilities"

          # --version reports what THIS binary carries. A build that silently missed
          # pwiz-sharp still compiles, still runs, and still writes mzML, so without a check
          # here the job would go green having proved nothing.
          for expected in .raw .d .wiff2 mzXML mzMLb mgf; do
            if ! echo "$capabilities" | grep -qF -- "$expected"; then
              echo "::error::$expected missing - this build did not pick up pwiz-sharp"
              exit 1
            fi
          done
          echo "Vendor reading and every output format are present."

  # Produces the same artifacts a release would, on every push and pull request, so a
  # build is downloadable without cutting a release and so packaging breaks surface here
  # rather than at tag time.
  package:
    name: Package ${{ matrix.rid }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     archive: zip }
          - { os: ubuntu-latest,  rid: linux-x64,   archive: tar }
          - { os: macos-latest,   rid: osx-arm64,   archive: tar }
          - { os: macos-13,       rid: osx-x64,     archive: tar }
          # No hosted arm64 runner in the standard pool for either of these, so they are
          # cross-compiled and NOT smoke tested. GitHub's windows-11-arm runner can be
          # swapped in for win-arm64 if it becomes available to this repository.
          - { os: windows-latest, rid: win-arm64,   archive: zip, cross: true }
          - { os: ubuntu-latest,  rid: linux-arm64, archive: tar, cross: true }

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained
        working-directory: dotnet
        run: >
          dotnet publish MARS/MARS.csproj
          -c Release -f net8.0 -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: Smoke test
        if: ${{ !matrix.cross }}
        working-directory: dotnet/publish/${{ matrix.rid }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then bin=./mars.exe; else bin=./mars; chmod +x "$bin"; fi
          "$bin" --version
          "$bin" verify --help > /dev/null
          "$bin" qc --help > /dev/null

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        working-directory: dotnet/publish/${{ matrix.rid }}
        run: |
          chmod +x mars
          tar czf "../../../mars-${{ matrix.rid }}.tar.gz" .

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        working-directory: dotnet/publish/${{ matrix.rid }}
        shell: pwsh
        run: Compress-Archive -Path * -DestinationPath "$env:GITHUB_WORKSPACE/mars-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mars-${{ matrix.rid }}
          path: |
            mars-*.tar.gz
            mars-*.zip
          if-no-files-found: error
          retention-days: 14

  # MARS targets net8.0 by default, which runs unchanged on the .NET 10 runtime. Building
  # AGAINST net10.0 is the forward-looking case the port spec asks for. It is not the
  # target that ships, so it reports rather than gates.
  net10:
    name: Build and test against net10.0 (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # A semicolon-separated list cannot be passed on the command line: the shell strips
      # the quotes and MSBuild reads net10.0 as a second property, and escaping it as %3B
      # instead makes MSBuild treat the whole string as one target framework.
      # MarsIncludeNet10 selects the pair inside Directory.Build.props.
      - name: Build
        working-directory: dotnet
        run: dotnet build -c Release -p:MarsIncludeNet10=true

      - name: Test
        working-directory: dotnet
        run: >
          dotnet test --no-build -c Release -f net10.0
          -p:MarsIncludeNet10=true
          --logger "console;verbosity=normal"

  determinism:
    name: Determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build
        working-directory: dotnet
        run: dotnet build -c Release

      # MARS writes m/z values into files that get reprocessed and compared, so identical
      # input must give a bit-identical output at any thread count. Broken out as its own
      # job so a failure here is unmistakable rather than one line in a long test log.
      - name: Same input, same bytes, any thread count
        working-directory: dotnet
        run: dotnet test --no-build -c Release --filter "FullyQualifiedName~Deterministic"

  vendor-drift:
    name: Vendored Osprey.ML drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Osprey.ML owns the boosting code; MARS carries a hash-guarded copy. This fails
      # when someone edits the copy instead of fixing it upstream in pwiz.
      - name: Check vendored hashes
        working-directory: dotnet
        run: dotnet test -c Release --filter "FullyQualifiedName~VendoredOsprey"
