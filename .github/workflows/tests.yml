name: Tests

# The Python implementation is frozen to bug fixes and will be archived once the C# one
# has been used in earnest, but while the code is here its tests still run. Scoped to the
# Python tree so a C#-only change does not trigger them.
on:
  push:
    branches: [main]
    paths:
      - 'mars/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mars/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests
        run: pytest tests/ -v --tb=short
      
      - name: Lint with ruff
        run: ruff check mars/
